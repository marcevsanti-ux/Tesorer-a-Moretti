name: Validar Mesa de Ayuda
on:
  push:
    branches: [feature/mesa-de-ayuda]
    paths: [mesa-de-ayuda.html, tests/mesa-indicadores.test.cjs, .github/workflows/validar-mesa.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/mesa-indicadores.test.cjs
